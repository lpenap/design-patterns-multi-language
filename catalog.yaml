# Single source of truth for patterns, languages and implementation locations.
# Everything cross-cutting (README table, CI matrix, conformance checks) is
# generated from or validated against this file. See PLAN.md §2 and §11.
version: 1

languages:
  java:
    name: Java
    dir: java
    run: "java -jar java/target/patterns.jar"
  python:
    name: Python
    dir: python
    run: "uv run --project python patterns"
  typescript:
    name: TypeScript
    dir: typescript
    run: "pnpm --dir typescript exec tsx src/cli.ts"
  javascript:
    name: JavaScript
    dir: javascript
    run: "node javascript/src/cli.js"

categories:
  - id: creational
    name: Creational
  - id: structural
    name: Structural
  - id: behavioural
    name: Behavioural
  - id: concurrency
    name: Concurrency constructs
  - id: enterprise
    name: Enterprise

# `implementations` is filled in by each pattern's spec; empty means pending.
# `parity: strict` requires byte-identical output across languages.
patterns:
  # ---- Creational ----
  - id: abstract-factory
    icon: "🌰"
    name: Abstract Factory
    category: creational
    intent: Provide an interface for creating families of related objects without naming their concrete classes.
    doc: docs/patterns/abstract-factory.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/abstractfactory
      python: python/src/patterns/abstractfactory
      typescript: typescript/src/abstract-factory
      javascript: javascript/src/abstract-factory
  - id: builder
    icon: "👷"
    name: Builder
    category: creational
    intent: Separate the construction of a complex object from its representation so the same process can create different representations.
    doc: docs/patterns/builder.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/builder
      python: python/src/patterns/builder
      typescript: typescript/src/builder
      javascript: javascript/src/builder
  - id: factory-method
    icon: "🏭"
    name: Factory Method
    category: creational
    intent: Define an interface for creating an object, but let subclasses decide which class to instantiate.
    doc: docs/patterns/factory-method.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/factorymethod
      python: python/src/patterns/factorymethod
      typescript: typescript/src/factory-method
      javascript: javascript/src/factory-method
  - id: simple-factory
    icon: "🏗️"
    name: Simple Factory
    category: creational
    intent: Centralise the creation of related products behind a single method that selects the concrete class.
    doc: docs/patterns/simple-factory.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/simplefactory
      python: python/src/patterns/simplefactory
      typescript: typescript/src/simple-factory
      javascript: javascript/src/simple-factory
  - id: monostate
    icon: "🔂"
    name: Monostate
    category: creational
    intent: Share all state among every instance of a class while leaving instantiation unconstrained.
    doc: docs/patterns/monostate.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/monostate
      python: python/src/patterns/monostate
      typescript: typescript/src/monostate
      javascript: javascript/src/monostate
  - id: prototype
    icon: "🃏"
    name: Prototype
    category: creational
    intent: Specify the kinds of objects to create using a prototypical instance, and create new objects by copying it.
    doc: docs/patterns/prototype.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/prototype
      python: python/src/patterns/prototype
      typescript: typescript/src/prototype
      javascript: javascript/src/prototype
  - id: singleton
    icon: "💍"
    name: Singleton
    category: creational
    intent: Ensure a class has exactly one instance and provide a global point of access to it.
    doc: docs/patterns/singleton.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/singleton
      python: python/src/patterns/singleton
      typescript: typescript/src/singleton
      javascript: javascript/src/singleton

  # ---- Structural ----
  - id: adapter
    icon: "🔌"
    name: Adapter
    category: structural
    intent: Convert the interface of a class into another interface clients expect.
    doc: docs/patterns/adapter.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/adapter
      python: python/src/patterns/adapter
      typescript: typescript/src/adapter
      javascript: javascript/src/adapter
  - id: bridge
    icon: "🌉"
    name: Bridge
    category: structural
    intent: Decouple an abstraction from its implementation so the two can vary independently.
    doc: docs/patterns/bridge.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/bridge
      python: python/src/patterns/bridge
      typescript: typescript/src/bridge
      javascript: javascript/src/bridge
  - id: composite
    icon: "🌿"
    name: Composite
    category: structural
    intent: Compose objects into tree structures and let clients treat individual objects and compositions uniformly.
    doc: docs/patterns/composite.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/composite
      python: python/src/patterns/composite
      typescript: typescript/src/composite
      javascript: javascript/src/composite
  - id: decorator
    icon: "🍧"
    name: Decorator
    category: structural
    intent: Attach additional responsibilities to an object dynamically.
    doc: docs/patterns/decorator.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/decorator
      python: python/src/patterns/decorator
      typescript: typescript/src/decorator
      javascript: javascript/src/decorator
  - id: facade
    icon: "🎁"
    name: Façade
    category: structural
    intent: Provide a unified, higher-level interface to a set of interfaces in a subsystem.
    doc: docs/patterns/facade.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/facade
      python: python/src/patterns/facade
      typescript: typescript/src/facade
      javascript: javascript/src/facade
  - id: flyweight
    icon: "🍃"
    name: Flyweight
    category: structural
    intent: Use sharing to support large numbers of fine-grained objects efficiently.
    doc: docs/patterns/flyweight.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/flyweight
      python: python/src/patterns/flyweight
      typescript: typescript/src/flyweight
      javascript: javascript/src/flyweight
  - id: protection-proxy
    icon: "☔"
    name: Protection Proxy
    category: structural
    intent: Control access to an object by checking the caller's rights before forwarding a request.
    doc: docs/patterns/protection-proxy.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/protectionproxy
      python: python/src/patterns/protectionproxy
      typescript: typescript/src/protection-proxy
      javascript: javascript/src/protection-proxy
  - id: virtual-proxy
    icon: "🍬"
    name: Virtual Proxy
    category: structural
    intent: Defer the creation of an expensive object until it is actually needed.
    doc: docs/patterns/virtual-proxy.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/virtualproxy
      python: python/src/patterns/virtualproxy
      typescript: typescript/src/virtual-proxy
      javascript: javascript/src/virtual-proxy

  # ---- Behavioural ----
  - id: chain-of-responsibility
    icon: "🐝"
    name: Chain of Responsibility
    category: behavioural
    intent: Pass a request along a chain of handlers until one of them handles it.
    doc: docs/patterns/chain-of-responsibility.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/chainofresponsibility
      python: python/src/patterns/chainofresponsibility
      typescript: typescript/src/chain-of-responsibility
      javascript: javascript/src/chain-of-responsibility
  - id: command
    icon: "👫"
    name: Command
    category: behavioural
    intent: Encapsulate a request as an object, allowing requests to be queued, logged and undone.
    doc: docs/patterns/command.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/command
      python: python/src/patterns/command
      typescript: typescript/src/command
      javascript: javascript/src/command
  - id: interpreter
    icon: "🎶"
    name: Interpreter
    category: behavioural
    intent: Given a language, define a representation for its grammar along with an interpreter that uses it.
    doc: docs/patterns/interpreter.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/interpreter
      python: python/src/patterns/interpreter
      typescript: typescript/src/interpreter
      javascript: javascript/src/interpreter
  - id: iterator
    icon: "🍫"
    name: Iterator
    category: behavioural
    intent: Provide sequential access to the elements of an aggregate without exposing its underlying representation.
    doc: docs/patterns/iterator.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/iterator
      python: python/src/patterns/iterator
      typescript: typescript/src/iterator
      javascript: javascript/src/iterator
  - id: mediator
    icon: "💐"
    name: Mediator
    category: behavioural
    intent: Define an object that encapsulates how a set of objects interact, keeping them from referring to each other explicitly.
    doc: docs/patterns/mediator.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/mediator
      python: python/src/patterns/mediator
      typescript: typescript/src/mediator
      javascript: javascript/src/mediator
  - id: memento
    icon: "💾"
    name: Memento
    category: behavioural
    intent: Capture and externalise an object's internal state so it can be restored later, without violating encapsulation.
    doc: docs/patterns/memento.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/memento
      python: python/src/patterns/memento
      typescript: typescript/src/memento
      javascript: javascript/src/memento
  - id: observer
    icon: "👓"
    name: Observer
    category: behavioural
    intent: Define a one-to-many dependency so that dependents are notified when a subject changes state.
    doc: docs/patterns/observer.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/observer
      python: python/src/patterns/observer
      typescript: typescript/src/observer
      javascript: javascript/src/observer
  - id: state
    icon: "🐉"
    name: State
    category: behavioural
    intent: Allow an object to alter its behaviour when its internal state changes; the object appears to change class.
    doc: docs/patterns/state.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/state
      python: python/src/patterns/state
      typescript: typescript/src/state
      javascript: javascript/src/state
  - id: strategy
    icon: "💡"
    name: Strategy
    category: behavioural
    intent: Define a family of interchangeable algorithms and let the client choose one at run time.
    doc: docs/patterns/strategy.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/strategy
      python: python/src/patterns/strategy
      typescript: typescript/src/strategy
      javascript: javascript/src/strategy
  - id: template-method
    icon: "📝"
    name: Template Method
    category: behavioural
    intent: Define the skeleton of an algorithm and defer some steps to subclasses.
    doc: docs/patterns/template-method.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/templatemethod
      python: python/src/patterns/templatemethod
      typescript: typescript/src/template-method
      javascript: javascript/src/template-method
  - id: visitor
    icon: "🏃"
    name: Visitor
    category: behavioural
    intent: Represent an operation to be performed on the elements of an object structure without changing their classes.
    doc: docs/patterns/visitor.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/visitor
      python: python/src/patterns/visitor
      typescript: typescript/src/visitor
      javascript: javascript/src/visitor

  # ---- Concurrency constructs ----
  - id: producer-consumer
    icon: "🔄"
    name: Producer/Consumer
    category: concurrency
    # The example prints a summary (produced, consumed sorted, exactly-once),
    # never the interleaving, so the output is identical on every run.
    parity: strict
    intent: Coordinate threads that generate data with threads that process it through a bounded, thread-safe buffer.
    doc: docs/patterns/producer-consumer.md
    implementations:
      java: java/src/main/java/com/penapereira/patterns/producerconsumer
      python: python/src/patterns/producerconsumer
      typescript: typescript/src/producer-consumer
      javascript: javascript/src/producer-consumer
  # ---- Phase 5 (decisions 17–21): implementations are filled in by each language's PR ----
  - id: object-pool
    icon: "♻️"
    name: Object Pool
    category: creational
    intent: Reuse a bounded set of expensive-to-create objects by lending them out and taking them back instead of creating and discarding them.
    doc: docs/patterns/object-pool.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/objectpool
      python: python/src/patterns/objectpool
      typescript: typescript/src/object-pool
      javascript: javascript/src/object-pool
  - id: null-object
    icon: "🫥"
    name: Null Object
    category: behavioural
    intent: Provide a do-nothing collaborator with the expected interface so clients never test for null.
    doc: docs/patterns/null-object.md
    parity: strict
    implementations:
      java: java/src/main/java/com/penapereira/patterns/nullobject
      python: python/src/patterns/nullobject
  - id: monitor
    icon: "🚦"
    name: Monitor
    category: concurrency
    intent: Bundle shared state with the lock and condition variables that guard it, so callers never synchronise by hand.
    doc: docs/patterns/monitor.md
    parity: strict
  - id: read-write-lock
    icon: "📖"
    name: Read/Write Lock
    category: concurrency
    intent: Let many readers share access to a resource while a writer gets it exclusively.
    doc: docs/patterns/read-write-lock.md
    parity: strict
  - id: future-promise
    icon: "🔮"
    name: Future/Promise
    category: concurrency
    intent: Represent a result that will be available later, so callers compose and wait on it instead of blocking at once.
    doc: docs/patterns/future-promise.md
    parity: strict
  - id: thread-pool
    icon: "🧵"
    name: Thread Pool
    category: concurrency
    intent: Run submitted tasks on a fixed set of worker threads instead of creating a thread per task.
    doc: docs/patterns/thread-pool.md
    parity: strict
  - id: guarded-suspension
    icon: "⏸️"
    name: Guarded Suspension
    category: concurrency
    intent: Suspend a call until its precondition holds, then run it.
    doc: docs/patterns/guarded-suspension.md
    parity: strict
  - id: value-object
    icon: "💎"
    name: Value Object
    category: enterprise
    intent: A small immutable object whose equality rests on its value, not its identity.
    doc: docs/patterns/value-object.md
    parity: strict
  - id: money
    icon: "💰"
    name: Money
    category: enterprise
    intent: Represent a monetary amount with its currency and exact arithmetic, including allocation that loses no cents.
    doc: docs/patterns/money.md
    parity: strict
  - id: data-transfer-object
    icon: "📦"
    name: Data Transfer Object
    category: enterprise
    intent: Carry data between layers or processes in one object to reduce the number of calls.
    doc: docs/patterns/data-transfer-object.md
    parity: strict
  - id: registry
    icon: "📇"
    name: Registry
    category: enterprise
    intent: A well-known object through which other objects find common objects and services.
    doc: docs/patterns/registry.md
    parity: strict
  - id: plugin
    icon: "🔌"
    name: Plugin
    category: enterprise
    intent: Link classes during configuration rather than compilation.
    doc: docs/patterns/plugin.md
    parity: strict
  - id: service-stub
    icon: "🎭"
    name: Service Stub
    category: enterprise
    intent: Replace a problematic external service with a stand-in during development and testing.
    doc: docs/patterns/service-stub.md
    parity: strict
  - id: transaction-script
    icon: "📜"
    name: Transaction Script
    category: enterprise
    intent: Organise business logic as one procedure per request.
    doc: docs/patterns/transaction-script.md
    parity: strict
  - id: domain-model
    icon: "🧠"
    name: Domain Model
    category: enterprise
    intent: An object model of the domain that incorporates both behaviour and data.
    doc: docs/patterns/domain-model.md
    parity: strict
  - id: service-layer
    icon: "🛎️"
    name: Service Layer
    category: enterprise
    intent: Define an application's boundary with a layer of services that coordinates the domain and exposes the available operations.
    doc: docs/patterns/service-layer.md
    parity: strict
  - id: active-record
    icon: "🗂️"
    name: Active Record
    category: enterprise
    intent: An object that wraps a row, encapsulates its data access and adds domain logic.
    doc: docs/patterns/active-record.md
    parity: strict
  - id: data-mapper
    icon: "🗺️"
    name: Data Mapper
    category: enterprise
    intent: A layer of mappers that moves data between objects and a store while keeping the two independent.
    doc: docs/patterns/data-mapper.md
    parity: strict
  - id: identity-map
    icon: "🪪"
    name: Identity Map
    category: enterprise
    intent: Load each object once by keeping every loaded object in a map keyed by identity.
    doc: docs/patterns/identity-map.md
    parity: strict
  - id: unit-of-work
    icon: "📝"
    name: Unit of Work
    category: enterprise
    intent: Track the objects affected by a business transaction and commit their changes as one.
    doc: docs/patterns/unit-of-work.md
    parity: strict
  - id: repository
    icon: "🏛️"
    name: Repository
    category: enterprise
    intent: Mediate between the domain and the data mapping layer with a collection-like interface.
    doc: docs/patterns/repository.md
    parity: strict
  - id: optimistic-offline-lock
    icon: "🔒"
    name: Optimistic Offline Lock
    category: enterprise
    intent: Detect conflicts between concurrent business transactions with a version check at commit.
    doc: docs/patterns/optimistic-offline-lock.md
    parity: strict
  - id: model-view-controller
    icon: "🖼️"
    name: Model-View-Controller
    category: enterprise
    intent: Split user-interface interaction into model, view and controller.
    doc: docs/patterns/model-view-controller.md
    parity: strict
