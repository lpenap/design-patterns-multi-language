name: java

on:
  push:
    branches: [master]
    paths: ["java/**", ".github/workflows/java.yml"]
  pull_request:
    paths: ["java/**", ".github/workflows/java.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: jacoco-report
          path: java/target/site/jacoco/
